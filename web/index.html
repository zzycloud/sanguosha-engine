<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三国杀对局观察</title>
<style>
:root {
  --bg: #efe9dd; --bg-2: #e6dece; --panel: #fbf8f1; --panel-2: #f4efe4; --ink: #221e18; --ink-2: #4a4339;
  --muted: #857b6c; --line: #d9cfbd; --line-2: #c8bba4;
  --accent: #8f2a1c; --accent-ink: #fff7ee; --accent-soft: #f1ddd3; --gold: #a87a22; --gold-soft: #f4e7c8;
  --red: #b8321f; --suit-black: #1f1c18; --green: #3f7d4e; --amber: #b9821c; --blue: #34588f; --violet: #6b4a96;
  --card: #fffdf7; --card-edge: #d8ccb5; --back-a: #7d2416; --back-b: #5f1a0f;
  --wei: #3a5a94; --shu: #a83426; --wu: #3b7a48; --qun: #6c6358;
  --hl: #fbefc4; --shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 18px -10px rgba(60,40,20,.35);
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
  --sans: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141215; --bg-2: #1b181c; --panel: #1f1c21; --panel-2: #262229; --ink: #efe8dc; --ink-2: #cfc6b7;
    --muted: #978d7f; --line: #36303a; --line-2: #4a4250;
    --accent: #e0745c; --accent-ink: #1c0f0b; --accent-soft: #3b2420; --gold: #e0b057; --gold-soft: #3a3020;
    --red: #ff7a64; --suit-black: #efe8dc; --green: #7cc28c; --amber: #e7b04c; --blue: #86a9e4; --violet: #b597e6;
    --card: #2b272e; --card-edge: #48404d; --back-a: #6a2216; --back-b: #43140c;
    --wei: #7d9ddb; --shu: #e27766; --wu: #78bd86; --qun: #aaa093;
    --hl: #3b3320; --shadow: 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --bg: #141215; --bg-2: #1b181c; --panel: #1f1c21; --panel-2: #262229; --ink: #efe8dc; --ink-2: #cfc6b7;
  --muted: #978d7f; --line: #36303a; --line-2: #4a4250;
  --accent: #e0745c; --accent-ink: #1c0f0b; --accent-soft: #3b2420; --gold: #e0b057; --gold-soft: #3a3020;
  --red: #ff7a64; --suit-black: #efe8dc; --green: #7cc28c; --amber: #e7b04c; --blue: #86a9e4; --violet: #b597e6;
  --card: #2b272e; --card-edge: #48404d; --back-a: #6a2216; --back-b: #43140c;
  --wei: #7d9ddb; --shu: #e27766; --wu: #78bd86; --qun: #aaa093;
  --hl: #3b3320; --shadow: 0 8px 22px -12px rgba(0,0,0,.7);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); min-height: 100vh;
  background-image: radial-gradient(ellipse at 50% -10%, var(--bg-2), transparent 60%); }
button, select { font: inherit; color: inherit; }

/* ---------- 顶栏 ---------- */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 88%, transparent);
  position: sticky; top: 0; z-index: 5; backdrop-filter: blur(6px); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .seal { font-family: var(--serif); font-weight: 900; font-size: 15px; color: var(--accent-ink);
  background: var(--accent); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px;
  transform: translateY(6px); letter-spacing: 0; }
.brand h1 { font-family: var(--serif); font-size: 19px; margin: 0; letter-spacing: 3px; font-weight: 800; }
.match { color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.match b { color: var(--ink); font-family: var(--serif); font-size: 15px; }
.badge { font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); font-weight: 600; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 11px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; padding: 4px 11px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.iconbtn { width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; }
.iconbtn svg { width: 16px; height: 16px; }
.lbl { font-size: 12px; color: var(--muted); }

/* ---------- 布局 ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; padding: 18px 20px 120px;
  max-width: 1380px; margin: 0 auto; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; padding: 12px 16px 150px; } }
.table { display: grid; gap: 14px; align-content: start; }
.side { display: grid; gap: 14px; align-content: start; }
@media (min-width: 1001px) { .side { position: sticky; top: 70px; max-height: calc(100vh - 190px); grid-template-rows: auto minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

/* ---------- 座位 ---------- */
.seat { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding: 14px; position: relative;
  transition: border-color .2s, box-shadow .2s; }
.seat.active { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow); }
.seat.dead { filter: grayscale(1); opacity: .6; }
.seat.hit { animation: hit .7s ease-out; }
@keyframes hit { 0% { box-shadow: 0 0 0 0 var(--red), var(--shadow); background: color-mix(in srgb, var(--red) 14%, var(--panel)); }
  100% { box-shadow: 0 0 0 14px transparent, var(--shadow); } }
.turnflag { position: absolute; top: -10px; left: 18px; font-size: 11px; font-weight: 700; letter-spacing: 1px;
  background: var(--gold); color: var(--panel); padding: 1px 8px; border-radius: 99px; }
.portrait { border-radius: 10px; height: 150px; position: relative; overflow: hidden; color: #fff;
  background: linear-gradient(160deg, color-mix(in srgb, var(--k) 92%, #fff 8%), color-mix(in srgb, var(--k) 70%, #000 30%));
  display: grid; grid-template-rows: auto 1fr auto; padding: 8px; }
.portrait::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(115deg, rgba(255,255,255,.06) 0 2px, transparent 2px 9px); }
.portrait .k { justify-self: start; font-family: var(--serif); font-weight: 900; font-size: 15px; width: 26px; height: 26px;
  display: grid; place-items: center; border: 1.5px solid rgba(255,255,255,.8); border-radius: 50%; }
.portrait .gname { font-family: var(--serif); font-weight: 900; font-size: 30px; line-height: 1.05; writing-mode: vertical-rl;
  justify-self: end; align-self: center; letter-spacing: 4px; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
.portrait .seatno { font-size: 11px; opacity: .85; }
.hpbar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.bead { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--line-2); background: transparent; }
.bead.on { border-color: transparent; background: radial-gradient(circle at 35% 30%, #fff8 0 2px, transparent 3px), var(--hpc); }
.hptext { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.zones { display: grid; gap: 9px; min-width: 0; }
.zrow { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 8px; }
.zrow > .lbl { text-align: right; }
.skills { display: flex; gap: 6px; flex-wrap: wrap; }
.skill { font-family: var(--serif); font-weight: 700; font-size: 13px; padding: 1px 9px; border-radius: 6px;
  border: 1px solid var(--line-2); background: var(--panel-2); cursor: help; }
.skill .tag { font-family: var(--sans, inherit); font-weight: 600; font-size: 10px; color: var(--muted); margin-left: 4px; }
.skill.t-锁定技 .tag, .skill.t-被动技 .tag { color: var(--blue); }
.skill.t-主动技 .tag { color: var(--accent); }
.skill.t-触发技 .tag { color: var(--gold); }
.skill.lordsk { opacity: .55; border-style: dashed; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { border: 1px dashed var(--line-2); border-radius: 7px; min-height: 30px; padding: 3px 6px; font-size: 12px;
  display: flex; align-items: center; gap: 4px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.slot.filled { border-style: solid; background: var(--card); color: var(--ink); }
.slot .st { font-size: 10px; color: var(--muted); }
.cards { display: flex; gap: 6px; flex-wrap: wrap; min-height: 30px; align-items: center; }
.none { color: var(--muted); font-size: 12px; }

/* ---------- 牌 ---------- */
.card { --w: 50px; width: var(--w); height: calc(var(--w) * 1.38); border-radius: 6px; background: var(--card);
  border: 1px solid var(--card-edge); position: relative; display: grid; place-items: center; flex: none;
  box-shadow: 0 2px 4px -2px rgba(0,0,0,.25); transition: transform .15s; }
.card:hover { transform: translateY(-3px); z-index: 1; }
.card .cr { position: absolute; top: 3px; left: 4px; font-size: 11px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .cr .s { display: block; font-size: 12px; margin-top: 1px; }
.card .cn { font-family: var(--serif); font-weight: 800; font-size: 12px; text-align: center; line-height: 1.1;
  padding: 10px 3px 0; word-break: break-all; }
.card .ct { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 0 0 5px 5px; background: var(--tc); }
.card.red .cr { color: var(--red); } .card.black .cr { color: var(--suit-black); }
.card.t-basic { --tc: var(--line-2); } .card.t-trick { --tc: var(--blue); } .card.t-delayed { --tc: var(--violet); } .card.t-equip { --tc: var(--amber); }
.card.big { --w: 64px; } .card.big .cn { font-size: 14px; }
.card .as { position: absolute; bottom: 6px; font-size: 10px; color: var(--violet); font-weight: 700; }
.back { width: 34px; height: 47px; border-radius: 5px; flex: none; border: 1px solid var(--back-b);
  background: repeating-linear-gradient(45deg, var(--back-a) 0 4px, var(--back-b) 4px 8px); position: relative; }
.back::after { content: "杀"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.55);
  font-family: var(--serif); font-weight: 900; font-size: 13px; }
.backs { display: flex; align-items: center; }
.backs .back + .back { margin-left: -22px; }
.backs .n { margin-left: 10px; color: var(--muted); font-size: 12px; }

/* ---------- 中央台面 ---------- */
.board { padding: 14px 16px; display: grid; gap: 12px; background:
  radial-gradient(ellipse at center, color-mix(in srgb, var(--panel) 70%, var(--bg-2)), var(--panel)); }
.boardtop { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.turnno { font-family: var(--serif); font-weight: 900; font-size: 22px; letter-spacing: 2px; }
.turnno small { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: 6px; }
.phases { display: flex; gap: 3px; }
.phases span { font-size: 12px; padding: 2px 9px; border-radius: 99px; color: var(--muted); background: var(--panel-2); }
.phases span.on { background: var(--ink); color: var(--panel); font-weight: 600; }
.piles { display: flex; gap: 16px; margin-left: auto; color: var(--muted); font-size: 12px; align-items: center; }
.piles b { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.boardmid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; min-height: 96px; }
.proc { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 88px; padding: 6px 10px;
  border: 1px dashed var(--line-2); border-radius: 10px; }
.proc .none { margin: auto; }
.discard { display: grid; justify-items: center; gap: 4px; }
.event { font-family: var(--serif); font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 8px;
  background: var(--panel-2); border-left: 3px solid var(--ev, var(--line-2)); min-height: 36px; }
.event.damage { --ev: var(--red); } .event.recover { --ev: var(--green); } .event.death { --ev: var(--ink); }
.event.pass { --ev: var(--muted); } .event.skill { --ev: var(--gold); } .event.judge { --ev: var(--violet); }
.deckline { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* ---------- 决策 ---------- */
.decision { padding: 14px 16px; border-top: 4px solid var(--accent); }
.dhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dhead .who { font-family: var(--serif); font-weight: 900; font-size: 16px; }
.kind { font-size: 11px; padding: 0 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.auto { font-size: 11px; padding: 0 7px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
.prompt { margin: 6px 0 8px; color: var(--ink-2); }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 260px; overflow: auto; }
.opts li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding: 5px 8px; border-radius: 7px;
  border: 1px solid transparent; font-size: 13px; }
.opts li .i { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.opts li.chosen { background: var(--hl); border-color: color-mix(in srgb, var(--gold) 50%, transparent); font-weight: 700; }
.opts li.chosen .i::before { content: "✓"; color: var(--gold); }
.opts li.chosen .i span { display: none; }
.opts li.click { cursor: pointer; border-color: var(--line); }
.opts li.click:hover { background: var(--accent-soft); border-color: var(--accent); }
.evkind { font-size: 11px; padding: 0 7px; border-radius: 4px; background: var(--panel-2); color: var(--muted); font-weight: 700; }
.evtext { font-family: var(--serif); font-size: 16px; font-weight: 700; margin: 8px 0 2px; }
.evtext .pv { color: var(--violet); font-weight: 600; }
.winner { font-family: var(--serif); font-size: 20px; font-weight: 900; color: var(--gold); }
/* ---------- 模型调用 ---------- */
.layout.wide { grid-template-columns: minmax(0, 1fr) 500px; }
@media (max-width: 1000px) { .layout.wide { grid-template-columns: 1fr; } }
.decision.has-llm { max-height: 64vh; overflow: auto; }
.agentbox { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); display: grid; gap: 6px; font-size: 13px; }
.agentbox .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--panel-2); color: var(--ink-2); font-weight: 600; }
.tag.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.tag.bad { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.tag.warn { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.agentbox .why { color: var(--ink-2); }
.agentbox .err { color: var(--red); }
.agentbox details { border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); }
.agentbox details[open] { background: var(--panel); }
.agentbox summary { cursor: pointer; padding: 5px 8px; font-size: 12px; font-weight: 600; }
.agentbox summary .bad { color: var(--red); }
.msg { padding: 0 8px 8px; }
.msg .role { font-size: 11px; font-weight: 700; color: var(--muted); margin: 6px 0 2px; text-transform: uppercase; letter-spacing: .5px; }
.msg pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-height: 340px; overflow: auto; }
.msg pre.reply { border-color: color-mix(in srgb, var(--gold) 55%, transparent); }
.msg pre.http { border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.jump { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.jump .btn { font-size: 12px; padding: 3px 9px; }
.waiting { color: var(--muted); }

/* ---------- 日志 ---------- */
.logpanel { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 300px; }
.loghead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.loghead b { font-family: var(--serif); font-size: 15px; }
.loghead label { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; cursor: pointer; }
.log { overflow: auto; padding: 6px 8px 12px; font-size: 13px; max-height: 70vh; }
@media (min-width: 1001px) { .log { max-height: none; } }
.lt { font-family: var(--serif); font-weight: 800; color: var(--accent); padding: 10px 6px 3px; font-size: 13px;
  border-top: 1px solid var(--line); margin-top: 4px; }
.lt:first-child { border-top: 0; margin-top: 0; }
.ll { display: grid; grid-template-columns: 8px 1fr; gap: 8px; align-items: baseline; padding: 2px 6px; border-radius: 5px; cursor: pointer; }
.ll:hover { background: var(--panel-2); }
.ll .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dc, var(--line-2)); transform: translateY(-1px); }
.ll.future { opacity: .28; }
.ll.cur { background: var(--hl); }
.ll.phase { color: var(--muted); font-size: 12px; }
.ll.pass { color: var(--muted); }
.ll.damage { --dc: var(--red); } .ll.recover { --dc: var(--green); } .ll.use { --dc: var(--ink); }
.ll.respond { --dc: var(--blue); } .ll.skill { --dc: var(--gold); } .ll.judge { --dc: var(--violet); }
.ll.death, .ll.dying { --dc: var(--red); font-weight: 700; } .ll.draw, .ll.obtain { --dc: var(--green); opacity: .9; }
.ll .pv { color: var(--violet); }
.hide-phase .ll.phase { display: none; }

/* ---------- 底部控制条 ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px 20px 12px;
  background: color-mix(in srgb, var(--panel) 92%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
.dockin { max-width: 1380px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
@media (max-width: 700px) { .dockin { grid-template-columns: 1fr; gap: 6px; } }
.transport { display: flex; gap: 6px; align-items: center; }
.timeline { position: relative; cursor: pointer; }
.timeline svg { width: 100%; height: 42px; display: block; }
.timeline input { width: 100%; margin: 2px 0 0; accent-color: var(--accent); }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; white-space: nowrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.pos { font-variant-numeric: tabular-nums; }

@media (max-width: 640px) {
  .top { padding: 8px 16px; gap: 8px; }
  .seat { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 12px; }
  .portrait { height: 112px; } .portrait .gname { font-size: 22px; letter-spacing: 2px; }
  .bead { width: 11px; height: 11px; }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .zrow { grid-template-columns: 1fr; gap: 3px; } .zrow > .lbl { text-align: left; }
  .card { --w: 42px; } .card.big { --w: 52px; }
  .boardmid { grid-template-columns: 1fr; } .discard { display: none; }
  .piles { margin-left: 0; }
}
.empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty-state h2 { font-family: var(--serif); color: var(--ink); margin: 0 0 8px; }
code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="seal">杀</span><h1>对局观察</h1></div>
  <div class="match" id="match"></div>
  <span class="spacer"></span>
  <span class="lbl">视角</span>
  <div class="seg" id="persp" role="group" aria-label="视角"></div>
  <label class="btn" id="openlbl">打开录像<input type="file" id="file" accept=".json" hidden></label>
  <button class="btn iconbtn" id="theme" title="切换明暗" aria-label="切换明暗">
    <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
  </button>
</header>

<div class="layout" id="layout">
  <section class="table" id="table">
    <div class="panel empty-state" id="empty">
      <h2>还没有加载录像</h2>
      <p>用 <code>python -m sgs.replay -o replay.html</code> 生成自带录像的页面，或点右上角“打开录像”选一个 JSON。</p>
    </div>
  </section>
  <aside class="side">
    <div class="panel decision" id="decision" hidden></div>
    <div class="panel logpanel" id="logpanel" hidden>
      <div class="loghead"><b>对局日志</b><span class="lbl" id="logcount"></span>
        <label><input type="checkbox" id="showphase"> 显示阶段提示</label></div>
      <div class="log hide-phase" id="log"></div>
    </div>
  </aside>
</div>

<div class="dock" id="dock" hidden>
  <div class="dockin">
    <div class="transport">
      <button class="btn iconbtn" id="first" title="开头（Home）" aria-label="开头"><svg viewBox="0 0 16 16"><path d="M3 2v12M13 2 5 8l8 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="btn iconbtn" id="prev" title="上一步（←）" aria-label="上一步"><svg viewBox="0 0 16 16"><path d="M11 2 4 8l7 6z" fill="currentColor"/></svg></button>
      <button class="btn iconbtn primary" id="play" title="播放 / 暂停（空格）" aria-label="播放"><svg viewBox="0 0 16 16" id="playicon"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg></button>
      <button class="btn iconbtn" id="next" title="下一步（→）" aria-label="下一步"><svg viewBox="0 0 16 16"><path d="M5 2l7 6-7 6z" fill="currentColor"/></svg></button>
      <button class="btn iconbtn" id="last" title="结尾（End）" aria-label="结尾"><svg viewBox="0 0 16 16"><path d="M13 2v12M3 2l8 6-8 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <select class="btn" id="speed" aria-label="速度"><option value="1100">慢</option><option value="450" selected>中</option><option value="120">快</option></select>
    </div>
    <div class="timeline">
      <svg id="spark" preserveAspectRatio="none"></svg>
      <input type="range" id="slider" min="0" max="0" value="0" aria-label="进度">
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script id="embedded-replay" type="application/json"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const SLOTS = [["weapon", "武器"], ["armor", "防具"], ["plus_horse", "+1马"], ["minus_horse", "-1马"]];
  const PHASES = [["prepare", "准备"], ["judge", "判定"], ["draw", "摸牌"], ["play", "出牌"], ["discard", "弃牌"], ["finish", "结束"]];
  const KIND = { play: "出牌", respond: "响应", trigger: "发动", choose: "选择" };
  const EVK = { setup: "开局", turn: "回合开始", phase: "阶段", skip: "跳过阶段", draw: "摸牌", use: "使用", respond: "响应",
    pass: "没有响应", skill: "发动技能", judge: "判定", damage: "伤害", recover: "回复", losehp: "失去体力", dying: "濒死",
    death: "阵亡", discard: "弃牌", obtain: "获得", give: "交给", shuffle: "洗牌", info: "结算" };
  const KCOL = { "魏": "--wei", "蜀": "--shu", "吴": "--wu", "群": "--qun" };
  const SEATCOL = ["var(--accent)", "var(--blue)", "var(--green)", "var(--violet)"];

  let rep = null, idx = 0, timer = null, live = null, persp = null, lines = [], vis = [];
  let prefersPhase = false;
  try { prefersPhase = localStorage.getItem("sgs.showphase") === "1"; } catch (e) {}

  // ---------- 小组件 ----------
  const cardType = (name) => (rep && rep.meta && rep.meta.cards && rep.meta.cards[name] || {}).type || "basic";
  function card(c, cls = "", asName) {
    const color = (c.suit === "♥" || c.suit === "♦") ? "red" : "black";
    const t = asName ? "delayed" : cardType(c.name);
    const tip = `${c.suit}${c.rank} ${c.name}${asName && asName !== c.name ? "（当" + asName + "）" : ""}`;
    return `<div class="card ${color} t-${t} ${cls}" title="${esc(tip)}"><div class="cr">${esc(c.rank)}<span class="s">${c.suit}</span></div>` +
      `<div class="cn">${esc(c.name)}</div>${asName && asName !== c.name ? `<div class="as">当${esc(asName)}</div>` : ""}<div class="ct"></div></div>`;
  }
  const backs = (n) => n ? `<div class="backs">${Array.from({ length: Math.min(n, 8) }, () => '<div class="back"></div>').join("")}<span class="n">${n} 张</span></div>` : '<span class="none">没有手牌</span>';
  function hpColor(hp, max) { const r = hp / Math.max(1, max); return r > 0.66 ? "var(--green)" : r > 0.34 ? "var(--amber)" : "var(--red)"; }

  // ---------- 视角 ----------
  const canSeeAll = () => persp === null;
  function logVisible(e) {
    // 返回在当前视角下的文本；看不到返回 null
    let extra = null;
    if (e.private) {
      if (persp === null) extra = [...new Set(Object.values(e.private))].join("；");
      else if (e.private[persp] !== undefined) extra = e.private[persp];
    }
    if (!e.text) return extra === null ? null : { t: extra, pv: true };
    return { t: e.text, x: extra };
  }

  // 某个视角下能看到的步：看不到的事件（对方的私密信息）和对方的决策（对方被问了什么）都跳过，
  // 免得从“对方被问要不要出无懈可击”推断出对方有这张牌。
  function stepVisible(s) {
    if (persp === null) return true;
    if (s.type === "event") return s.logs.some((e) => logVisible(e));
    if (s.type === "decision") return s.decision.player === persp || s === rep.steps[rep.steps.length - 1];
    return true;
  }
  function buildVis() {
    vis = [];
    rep.steps.forEach((s, k) => { if (stepVisible(s)) vis.push(k); });
    $("slider").max = vis.length - 1;
  }
  const snap = (i) => { let best = vis[0]; for (const k of vis) { if (k <= i) best = k; else break; } return best; };
  const posOf = (i) => Math.max(0, vis.indexOf(i));

  // ---------- 渲染 ----------
  function seatHTML(p, st, hitSet) {
    const k = KCOL[p.kingdom] || "--qun";
    const beads = Array.from({ length: p.max_hp }, (_, i) => `<span class="bead ${i < p.hp ? "on" : ""}"></span>`).join("");
    const showHand = p.hand && (canSeeAll() || persp === p.seat);
    const hand = showHand ? (p.hand.length ? p.hand.map((c) => card(c)).join("") : '<span class="none">没有手牌</span>') : backs(p.hand_count);
    const slots = SLOTS.map(([s, n]) => {
      const c = p.equips[s];
      return c ? `<div class="slot filled" title="${esc(c.suit + c.rank + " " + c.name)}"><span class="st">${n}</span><span style="color:${(c.suit === "♥" || c.suit === "♦") ? "var(--red)" : "inherit"}">${c.suit}${esc(c.rank)}</span>${esc(c.name)}</div>`
               : `<div class="slot"><span class="st">${n}</span></div>`;
    }).join("");
    const judges = p.judges.length ? p.judges.map((c) => card(c, "", c.as_name)).join("") : '<span class="none">无</span>';
    const desc = (s) => (rep.meta && rep.meta.skills && rep.meta.skills[s]) || "";
    const stype = (s) => (rep.meta && rep.meta.skill_types && rep.meta.skill_types[s]) || "";
    const chip = (s, lord) => `<span class="skill t-${esc(stype(s))}${lord ? " lordsk" : ""}" title="${esc((stype(s) ? "【" + stype(s) + "】" : "") + desc(s) + (lord ? "（1v1 没有主公，不生效）" : ""))}">${esc(s)}<span class="tag">${esc(stype(s))}</span></span>`;
    const lords = (rep.meta && rep.meta.lord_skills && rep.meta.lord_skills[p.general]) || [];
    const active = st.current === p.seat && !st.over;
    return `<div class="panel seat ${active ? "active" : ""} ${p.alive ? "" : "dead"} ${hitSet.has(p.seat) ? "hit" : ""}" data-seat="${p.seat}">
      ${active ? '<span class="turnflag">回合中</span>' : ""}
      <div>
        <div class="portrait" style="--k: var(${k})"><span class="k">${esc(p.kingdom)}</span>
          <span class="gname">${esc(p.general || "?")}</span><span class="seatno">${p.seat} 号位${p.alive ? "" : " · 阵亡"}</span></div>
        <div class="hpbar" style="--hpc:${hpColor(p.hp, p.max_hp)}">${beads}</div>
        <div class="hptext">体力 ${p.hp} / ${p.max_hp}</div>
      </div>
      <div class="zones">
        <div class="zrow"><span class="lbl">技能</span><div class="skills">${p.skills.map((s) => chip(s, false)).join("") + lords.map((s) => chip(s, true)).join("") || '<span class="none">无</span>'}</div></div>
        <div class="zrow"><span class="lbl">装备</span><div class="slots">${slots}</div></div>
        <div class="zrow"><span class="lbl">判定</span><div class="cards">${judges}</div></div>
        <div class="zrow"><span class="lbl">手牌</span><div class="cards">${hand}</div></div>
      </div></div>`;
  }

  function boardHTML(st, step) {
    const ph = PHASES.map(([k, n]) => `<span class="${st.phase === k ? "on" : ""}">${n}</span>`).join("");
    const proc = st.processing.length ? st.processing.map((c) => card(c, "big")).join("") : '<span class="none">处理区空</span>';
    const top = (st.discard || []).slice(-1)[0];
    let ev = null;
    for (const e of step.logs) {
      const v = logVisible(e);
      if (v) ev = { kind: e.kind, t: v.t + (v.x ? "：" + v.x : "") };
    }
    const deckTop = canSeeAll() && st.deck_top && st.deck_top.length
      ? `<div class="deckline"><span>牌堆顶（上帝视角）</span>${st.deck_top.slice(0, 5).map((c) => `<span>${c.suit}${esc(c.rank)}${esc(c.name)}</span>`).join("·")}</div>` : "";
    return `<div class="panel board">
      <div class="boardtop"><div class="turnno">第 ${st.turn} 回合<small>${st.players[st.current] ? esc(st.players[st.current].general) + " 行动" : ""}</small></div>
        <div class="phases">${ph}</div>
        <div class="piles"><span>牌堆 <b>${st.deck_count}</b></span><span>弃牌堆 <b>${st.discard_count}</b></span></div></div>
      <div class="boardmid"><div class="proc">${proc}</div>
        <div class="discard">${top ? card(top, "big") : '<div class="back" style="width:64px;height:88px;opacity:.25"></div>'}<span class="lbl">弃牌堆顶</span></div></div>
      <div class="event ${ev ? ev.kind : ""}">${ev ? esc(ev.t) : "&nbsp;"}</div>
      ${deckTop}
    </div>`;
  }

  function render() {
    if (!rep) return;
    const step = rep.steps[idx], st = step.state, n = st.players.length;
    const hitSet = new Set();
    for (const e of step.logs) if ((e.kind === "damage" || e.kind === "losehp") && e.data) hitSet.add(e.data.target ?? e.data.seat);
    const bottom = persp === null ? (live && live.human !== null ? live.human : 0) : persp;
    const order = Array.from({ length: n }, (_, i) => (bottom + 1 + i) % n); // 对手在上，自己在下
    const top = order.slice(0, n - 1), me = bottom;
    $("table").innerHTML = top.map((s) => seatHTML(st.players[s], st, hitSet)).join("") + boardHTML(st, step) + seatHTML(st.players[me], st, hitSet);
    renderDecision(step, st);
    renderLog();
    $("slider").value = posOf(idx);
    drawSpark();
    $("legend").innerHTML = st.players.map((p, i) => `<span><i style="background:${SEATCOL[i]}"></i>${esc(p.general)}</span>`).join("") +
      `<span class="pos">第 ${idx} 步 · ${posOf(idx) + 1} / ${vis.length}</span>`;
    if (!live) try { history.replaceState(null, "", "#step=" + idx); } catch (e) {}
  }

  function renderDecision(step, st) {
    const d = step.decision, el = $("decision");
    el.hidden = false;
    if (step.type === "event") {
      const e = step.logs[0], v = logVisible(e) || { t: "" };
      const who = e.data && e.data.seat !== undefined && st.players[e.data.seat] ? st.players[e.data.seat].general : "";
      el.innerHTML = `<div class="dhead"><span class="evkind">${esc(EVK[e.kind] || "事件")}</span>${who ? `<span class="who">${esc(who)}</span>` : ""}</div>` +
        `<div class="evtext">${v.pv ? `<span class="pv">${esc(v.t)}</span>` : esc(v.t)}${v.x ? `<span class="pv">：${esc(v.x)}</span>` : ""}</div>`;
      return;
    }
    if (!d) {
      const w = rep.winner === null || rep.winner === undefined ? "平局" : `${st.players[rep.winner].general} 获胜`;
      el.innerHTML = `<div class="winner">${esc(w)}</div><div class="prompt">${esc(rep.result || "")}</div>`;
      return;
    }
    const who = st.players[d.player].general;
    const mine = canSeeAll() || persp === d.player;
    const clickable = live && live.human === d.player && step === rep.steps[rep.steps.length - 1] && !rep.result;
    const head = `<div class="dhead"><span class="who">${esc(who)}</span><span class="kind">${KIND[d.kind] || esc(d.kind)}</span>
      ${step.auto ? '<span class="auto">唯一选项，自动</span>' : ""}<span class="lbl">${d.player} 号位</span></div>`;
    el.classList.remove("has-llm");
    if (!mine) {
      el.innerHTML = head + `<div class="prompt waiting">等待对方决策……（当前视角看不到对方的选项）</div>`;
      return;
    }
    el.innerHTML = head + `<div class="prompt">${esc(d.prompt)}</div><ol class="opts">${d.options.map((o, i) =>
      `<li data-i="${i}" class="${i === step.chosen ? "chosen" : ""}${clickable ? " click" : ""}"><span class="i"><span>${i}</span></span><span>${esc(o)}</span></li>`).join("")}</ol>` +
      agentHTML(step) + jumpHTML();
    el.classList.toggle("has-llm", !!(step.calls && step.calls.length));
    bindJump(el);
    if (clickable) el.querySelectorAll("li").forEach((li) => li.onclick = () => liveAct(+li.dataset.i));
  }

  // ---------- 模型调用（对战输出的录像里才有）----------
  const SRC = { llm: ["模型给出", "ok"], fallback: ["兜底（模型没给出合法动作）", "bad"], single: ["唯一选项", ""], auto: ["不用想，自动选", ""] };
  const hasCalls = () => !!(rep && rep.llm_calls && rep.llm_calls.length);
  const isBad = (s) => s.info && (s.info.source === "fallback" || (s.info.errors && s.info.errors.length));
  function msgsHTML(msgs) {
    return msgs.map((m) => `<div class="role">${esc(m.role)}</div><pre>${esc(m.content)}</pre>`).join("");
  }
  function attemptHTML(a, n, first) {
    const bits = [`第 ${n} 次请求`];
    if (a.latency !== undefined && a.latency !== null) bits.push(`${a.latency} 秒`);
    const u = a.usage || {};
    if (u.prompt_tokens !== undefined) bits.push(`${u.prompt_tokens}+${u.completion_tokens} token`);
    let tail = "";
    if (a.error) tail = ` · <span class="bad">${esc(a.error_kind === "illegal" ? "不合法：" : "失败：")}${esc(a.error)}</span>`;
    else if (a.parsed !== undefined && a.parsed !== null) bits.push(`解析为 ${a.parsed}`);
    let msgs = a.messages || [];
    let note = "";
    if (n > 1 && first && first.messages && JSON.stringify(msgs.slice(0, first.messages.length)) === JSON.stringify(first.messages)) {
      note = `<div class="role">前 ${first.messages.length} 条消息同第 1 次请求</div>`;
      msgs = msgs.slice(first.messages.length);
    }
    const reply = a.text !== undefined && a.text !== null ? a.text : (typeof a.response === "string" ? a.response : JSON.stringify(a.response ?? "", null, 2));
    const http = a.http ? `<div class="role">HTTP 诊断</div><pre class="http">${esc(JSON.stringify(a.http, null, 2))}</pre>` : "";
    return `<details><summary>${esc(bits.join(" · "))}${tail}</summary><div class="msg">${note}${msgsHTML(msgs)}` +
      (a.reasoning ? `<div class="role">模型的思考</div><pre>${esc(a.reasoning)}</pre>` : "") +
      `<div class="role">模型的原始回复</div><pre class="reply">${esc(reply || "（空）")}</pre>${http}</div></details>`;
  }
  function agentHTML(step) {
    if (!step.agent && !step.info) return "";
    const info = step.info || {};
    const tags = [];
    if (step.agent) tags.push(`<span class="tag">${esc(step.agent)}</span>`);
    if (info.source && SRC[info.source]) tags.push(`<span class="tag ${SRC[info.source][1]}">${SRC[info.source][0]}</span>`);
    if (info.cot) tags.push(`<span class="tag">先分析</span>`);
    if (info.attempts) tags.push(`<span class="tag ${info.attempts > 1 ? "warn" : ""}">请求 ${info.attempts} 次</span>`);
    if (info.latency !== undefined && info.source !== "single" && info.source !== "auto") tags.push(`<span class="tag">${info.latency} 秒</span>`);
    let out = `<div class="agentbox"><div class="tags">${tags.join("")}</div>`;
    if (info.reason) out += `<div class="why">理由：${esc(info.reason)}</div>`;
    if (info.analysis) out += `<div class="why">分析：${esc(info.analysis)}</div>`;
    for (const e of info.errors || []) out += `<div class="err">${esc(e)}</div>`;
    for (const ci of step.calls || []) {
      const c = rep.llm_calls[ci];
      if (!c) continue;
      const at = c.attempts || [];
      out += at.map((a, j) => attemptHTML(a, j + 1, at[0])).join("");
    }
    return out + "</div>";
  }
  function findCall(from, dir, bad) {
    for (let p = posOf(from) + dir; p >= 0 && p < vis.length; p += dir) {
      const s = rep.steps[vis[p]];
      if (s.calls && s.calls.length && (!bad || isBad(s))) return vis[p];
    }
    return null;
  }
  function jumpHTML() {
    if (!hasCalls()) return "";
    return `<div class="jump"><button class="btn" data-j="-1">‹ 上个模型决策</button><button class="btn" data-j="1">下个模型决策 ›</button>` +
      `<button class="btn" data-j="-2">‹ 上个出问题的</button><button class="btn" data-j="2">下个出问题的 ›</button></div>`;
  }
  function bindJump(el) {
    el.querySelectorAll("[data-j]").forEach((b) => b.onclick = () => {
      const j = +b.dataset.j, k = findCall(idx, Math.sign(j), Math.abs(j) === 2);
      if (k === null) { b.disabled = true; b.textContent = Math.abs(j) === 2 ? "没有了（没有答错或兜底）" : "没有了"; return; }
      go(k);
    });
  }

  function buildLines() {
    lines = [];
    rep.steps.forEach((s, k) => s.logs.forEach((e) => lines.push({ e, k })));
  }
  function renderLog() {
    let html = "", count = 0, lastCur = null;
    for (const { e, k } of lines) {
      const v = logVisible(e);
      if (!v) continue;
      if (e.kind === "turn") { if (k <= idx) html += `<div class="lt" data-k="${k}">${esc(v.t.replace(/—/g, "").trim())}</div>`; continue; }
      if (k > idx || !stepVisible(rep.steps[k])) continue;
      count++;
      const cls = `ll ${e.kind}${k === idx ? " cur" : ""}`;
      html += `<div class="${cls}" data-k="${k}"><span class="dot"></span><span>${v.pv ? `<span class="pv">${esc(v.t)}</span>` : esc(v.t)}${v.x ? `<span class="pv">：${esc(v.x)}</span>` : ""}</span></div>`;
    }
    const log = $("log");
    log.innerHTML = html || '<div class="none" style="padding:8px">暂无</div>';
    log.className = "log" + ($("showphase").checked ? "" : " hide-phase");
    $("logcount").textContent = `${count} 条`;
    const cur = log.querySelector(".cur:last-of-type") || log.lastElementChild;
    if (cur) log.scrollTop = log.scrollHeight;
  }

  // ---------- 体力走势图 ----------
  let sparkCache = null;
  function drawSpark() {
    const svg = $("spark"), N = rep.steps.length;
    if (!sparkCache) {
      const maxhp = Math.max(...rep.steps[0].state.players.map((p) => p.max_hp), 1) + 1;
      const W = Math.max(N - 1, 1), H = 40;
      const y = (hp) => H - 2 - (Math.max(0, hp) / maxhp) * (H - 6);
      let turns = "", last = -1;
      rep.steps.forEach((s, k) => { if (s.state.turn !== last) { last = s.state.turn; turns += `<line x1="${k}" x2="${k}" y1="0" y2="${H}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`; } });
      const paths = rep.steps[0].state.players.map((_, i) => {
        const pts = rep.steps.map((s, k) => `${k},${y(s.state.players[i].hp).toFixed(1)}`).join(" ");
        return `<polyline points="${pts}" fill="none" stroke="${SEATCOL[i]}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
      }).join("");
      sparkCache = { W, H, base: turns + paths };
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    }
    svg.innerHTML = sparkCache.base + `<line x1="${idx}" x2="${idx}" y1="0" y2="${sparkCache.H}" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  }
  $("spark").addEventListener("click", (ev) => {
    if (!rep) return;
    const r = ev.currentTarget.getBoundingClientRect();
    go(Math.round((ev.clientX - r.left) / r.width * (rep.steps.length - 1)));
  });

  // ---------- 视角按钮 ----------
  function renderPersp() {
    const n = rep.steps[0].state.players.length;
    const opts = [[null, "上帝"]].concat(Array.from({ length: n }, (_, i) => [i, `${rep.generals[i] || i + " 号位"}`]));
    const lock = rep.hidden_for !== undefined && rep.hidden_for !== null;
    $("persp").innerHTML = opts.map(([v, t]) => `<button data-v="${v === null ? "" : v}" aria-pressed="${persp === v}" ${lock && v !== rep.hidden_for ? "disabled" : ""}>${esc(t)}</button>`).join("");
    $("persp").querySelectorAll("button").forEach((b) => b.onclick = () => { persp = b.dataset.v === "" ? null : +b.dataset.v; renderPersp(); buildVis(); idx = snap(idx); render(); });
  }

  // ---------- 加载与控制 ----------
  function load(r, keepIdx) {
    if (!r.meta) r.meta = { skills: {}, cards: {} };
    rep = r; sparkCache = null;
    if (rep.hidden_for !== undefined && rep.hidden_for !== null) persp = rep.hidden_for;
    buildVis();
    idx = keepIdx ? vis[vis.length - 1] : vis[0];
    $("empty") && $("empty").remove();
    $("logpanel").hidden = false; $("dock").hidden = false;
    const res = rep.result ? `<span class="badge">${esc(rep.result)}</span>` : "";
    const who = rep.agents ? rep.generals.map((g, i) => `${g}（${rep.agents[i]}）`) : rep.generals;
    $("match").innerHTML = `<b>${esc(who.join(" 对 "))}</b><span>${rep.game ? "第 " + esc(rep.game) + " 局 · " : ""}种子 ${esc(rep.seed)}</span>${res}`;
    $("layout").classList.toggle("wide", hasCalls());
    const m = /step=(\d+)/.exec(location.hash);
    if (m && !keepIdx) idx = snap(Math.min(rep.steps.length - 1, +m[1]));
    buildLines(); renderPersp(); render();
  }
  const go = (i) => { if (!rep) return; idx = snap(Math.max(0, Math.min(rep.steps.length - 1, i))); render(); };
  const stepBy = (d) => { if (!rep) return; const p = Math.max(0, Math.min(vis.length - 1, posOf(idx) + d)); idx = vis[p]; render(); };
  const setPlayIcon = (playing) => { $("playicon").innerHTML = playing ? '<path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/>' : '<path d="M4 2l10 6-10 6z" fill="currentColor"/>'; };
  function togglePlay() {
    if (!rep) return;
    if (timer) { clearInterval(timer); timer = null; setPlayIcon(false); return; }
    if (posOf(idx) >= vis.length - 1) go(0);
    setPlayIcon(true);
    timer = setInterval(() => { if (posOf(idx) >= vis.length - 1) togglePlay(); else stepBy(1); }, +$("speed").value);
  }
  $("first").onclick = () => go(0);
  $("last").onclick = () => go(rep.steps.length - 1);
  $("prev").onclick = () => stepBy(-1);
  $("next").onclick = () => stepBy(1);
  $("play").onclick = togglePlay;
  $("speed").onchange = () => { if (timer) { togglePlay(); togglePlay(); } };
  $("slider").oninput = (e) => { idx = vis[+e.target.value]; render(); };
  $("log").addEventListener("click", (e) => { const l = e.target.closest("[data-k]"); if (l) go(+l.dataset.k); });
  $("showphase").checked = prefersPhase;
  $("showphase").onchange = (e) => { try { localStorage.setItem("sgs.showphase", e.target.checked ? "1" : "0"); } catch (x) {} renderLog(); };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
    if (e.key === "ArrowRight") { stepBy(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { stepBy(-1); e.preventDefault(); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(rep.steps.length - 1);
    else if (e.key === " ") { togglePlay(); e.preventDefault(); }
  });
  window.addEventListener("hashchange", () => { const m = /step=(\d+)/.exec(location.hash); if (rep && m && +m[1] !== idx) go(+m[1]); });
  $("file").onchange = async (e) => { const f = e.target.files[0]; if (f) load(JSON.parse(await f.text())); };
  $("theme").onclick = () => {
    const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = r.dataset.theme || (dark ? "dark" : "light");
    r.dataset.theme = cur === "dark" ? "light" : "dark";
  };

  // ---------- 实时模式（python -m sgs.tools.serve）----------
  async function api(path, body) {
    const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    return res.json();
  }
  async function liveRefresh() { load(await api("/api/replay"), true); }
  async function liveAct(i) { await api("/api/act", { index: i }); await liveRefresh(); }
  window.sgsLive = { refresh: liveRefresh, act: liveAct };

  const emb = $("embedded-replay").textContent.trim();
  const params = new URLSearchParams(location.search);
  if (emb) load(JSON.parse(emb));
  else if (params.get("live")) {
    const h = params.get("human");
    live = { human: h === null || h === "" || h === "None" ? null : +h };
    persp = live.human;
    const b = document.createElement("button");
    b.className = "btn primary"; b.textContent = "新一局";
    b.onclick = async () => { await api("/api/new"); await liveRefresh(); };
    $("openlbl").replaceWith(b);
    liveRefresh();
  } else if (params.get("src")) fetch(params.get("src")).then((r) => r.json()).then((r) => load(r));
})();
</script>
</body>
