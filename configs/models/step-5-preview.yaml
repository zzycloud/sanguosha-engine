# 阶跃星辰 step-5-preview（推理模型，云 API，OpenAI 兼容）。
# 密钥不写在这里，放环境变量：先在终端里执行  export STEPFUN_API_KEY=你的密钥
agent: llm
label: step-5-preview
base_url: https://api.stepfun.com/step_plan/v1
model: step-5-preview
api_key_env: STEPFUN_API_KEY   # 从这个环境变量读密钥
reasoning_effort: low          # 思考强度：low / medium / high。越高越慢越贵，想得越多
temperature: 0.3
max_tokens: 4096               # 设宽：思考可能也算在里面，设小了会想到一半被截断
timeout: 180                   # 单次请求最多等几秒
