# 四组对比：同一个模型，分别加不加“武将技巧”和“三行短分析”，各打规则 AI，比胜率。
#
# 怎么跑：
#   export STEPFUN_API_KEY=你的密钥                                   # 密钥放环境变量，不写进文件
#   uv run python -m sgs.experiment configs/compare-tips-cot.yaml
#   uv run python -m sgs.experiment configs/compare-tips-cot.yaml --set base.match.games=50   # 临时改成每组 50 局
#
# 文件分两块：
#   base      四组共用的设置：打几局、A 和 B 是谁
#   variants  四组各自在 base 上改的地方，一组一个名字，结果按组名分子目录：
#     none  什么都不加
#     tips  加自己武将的技巧（configs/tips/武将名.md）
#     cot   关键决策先写三行短分析再给编号
#     both  两个都加
# 结果看 runs/compare-tips-cot-时间/comparison.md；每组子目录的 index.html 能点进每局看录像。
# 每组 10 局只看得出很大的差距，想下结论用 50 局以上。

name: compare-tips-cot
dir: runs/{name}-{time}
side: A                          # 统计 A 方的胜率

base:
  match:
    games: 10                    # 每组局数，要是偶数（每两局交换先后手）
    seed: 0
    swap: true
    concurrency: 4               # 同时打几局
    general_pool:                # 只从写了技巧的武将里抽；删掉这几行就用全部武将
      - 郭嘉
      - 诸葛亮
      - 司马懿
      - 甄姬
  players:
    A:
      include: models/step-5-preview.yaml   # 换模型就换成 models/ 下的另一个文件
      prompt: v2
      cot_max_chars: 80          # 三行短分析最多多少字
      # reasoning_effort: medium # 想在这个实验里改思考强度，取消注释（不写就用模型文件里的）
    B: rule                      # 对手是规则 AI。想让模型对模型，换成下面两行：
    # B:
    #   include: models/step-5-preview.yaml
  output:
    replays: all

variants:
  none:
    players:
      A:
        label: 无技巧无分析
  tips:
    players:
      A:
        label: 技巧
        tips: true
  cot:
    players:
      A:
        label: 关键分析
        cot: key
  both:
    players:
      A:
        label: 技巧加关键分析
        tips: true
        cot: key
