# 云 API 模型对你本地的模型。两边都引用 configs/models/ 里的模型文件。
#
#   export STEPFUN_API_KEY=你的密钥    # 密钥只放环境变量，不要写进文件
#   uv run python -m sgs.arena configs/cloud-api.yaml
#
# 付费 API 按 token 计费：一局 30～80 个决策点。先跑 2 局看 summary.json 里的 token 统计，再放大局数。

match:
  games: 2
  concurrency: 2

players:
  A:
    include: models/step-5-preview.yaml   # 相对这个文件的路径
    ask_reason: true                      # 让模型写理由，可以拿来做“讲理由”的数据
  B:
    include: models/qwen-local.yaml
    temperature: 0                        # include 之后还能覆盖模型文件里的任何一项

output:
  dir: runs/{name}-{time}
  replays: all
