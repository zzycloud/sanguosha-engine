# 云 API（任何 OpenAI 兼容的 /chat/completions）对你本地的模型。
#
#   export MY_API_KEY=sk-...          # 密钥只放环境变量，不要写进这个文件
#   python -m sgs.arena configs/cloud-api.yaml
#
# 付费 API 按 token 计费：一个决策点的提示词约 1000～2000 字，一局 30～80 个决策点。
# 先跑 2 局看 summary.json 里的 token 统计，再放大局数。

match:
  games: 2
  concurrency: 2

players:
  A:
    agent: llm
    label: cloud-model
    base_url: https://你的服务商地址/v1
    model: 模型名
    api_key_env: MY_API_KEY       # 从环境变量读密钥；也可以写 api_key: ${MY_API_KEY}
    temperature: 0.3
    max_tokens: 1024
    timeout: 90
    ask_reason: true              # 让模型写理由，可以拿来做“讲理由”的数据
  B:
    include: models/qwen-local.yaml   # 相对这个文件的路径
    temperature: 0                    # include 之后还能覆盖

output:
  dir: runs/{name}-{time}
  replays: all
