# 不花钱、不用 GPU，先把接模型的流程跑通。先在另一个终端起假模型服务：
#   python -m sgs.tools.fake_llm --port 8001
#   python -m sgs.arena configs/fake-model.yaml
#
# 假模型按 model 名模拟各种情况：fake（随机选合法动作）、fake-think（先输出思考）、
# fake-flaky（第一次乱答）、fake-bad（总是乱答）、fake-range（编号越界）、fake-500、fake-slow。

match:
  games: 4
  concurrency: 4

players:
  A:
    agent: llm
    base_url: http://127.0.0.1:8001/v1
    model: fake-flaky
    ask_reason: true
  B:
    agent: rule

output:
  dir: runs/{name}-{time}
  replays: 2
