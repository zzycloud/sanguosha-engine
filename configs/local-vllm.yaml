# 你自己部署的模型（vLLM / SGLang / Ollama 等 OpenAI 兼容服务）对规则 AI。
# 这份把所有字段都列出来了，不需要的删掉即可（删掉的用默认值）。
#
#   vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000
#   python -m sgs.arena configs/local-vllm.yaml
#   python -m sgs.arena configs/local-vllm.yaml --set match.games=100 --set players.A.temperature=0   # 临时改几项

name: qwen7b-vs-rule        # 不写就用文件名；输出目录里的 {name}

match:
  mode: duel                # 游戏模式，目前只有 1v1
  games: 20                 # 局数（开 swap 时最好是偶数）
  seed: 0                   # 第一局的种子；同样的种子 = 同样的牌堆和武将
  swap: true                # 每两局同一副牌、同一对武将，A、B 交换座位（抵消先手优势和发牌运气）
  generals: random          # random，或者 [0 号位武将, 1 号位武将]，例如 [关羽, 吕布]
  general_pool: null        # random 时从这些武将里抽，例如 [关羽, 吕布, 貂蝉, 诸葛亮]；null = 全部标准武将
  concurrency: 8            # 同时进行的对局数。接模型时调大，让推理服务的批处理吃满
  game_timeout: 1800        # 单局最多多少秒，超时中止（null 不限）
  max_steps: 20000          # 单局最多多少步

players:
  A:
    agent: llm                          # 用对话模型来打
    label: qwen2.5-7b                   # 统计和数据里显示的名字（不写就是 llm:模型名）

    # ---- 连接 ----
    client: openai                      # openai / vllm / sglang / ollama（只是默认地址不同），或 模块:类名
    base_url: http://localhost:8000/v1  # 到 /v1 为止
    model: Qwen/Qwen2.5-7B-Instruct     # 发给服务端的模型名；LoRA 就写 --lora-modules 里起的名字
    # api_key_env: MY_API_KEY           # 需要鉴权时，从这个环境变量读密钥（本地服务一般不用）
    timeout: 60                         # 单次请求最多等几秒
    http_retries: 3                     # 超时、连不上、429、5xx 时重试几次
    backoff: 1.0                        # 重试的指数退避基数（秒），等 1、2、4 秒……左右
    max_retry_after: 60                 # 服务端回了 Retry-After 时按它等，但最多等这么久
    proxy: auto                         # auto：本机和内网地址不走代理，其它按系统代理设置（HTTP_PROXY 等）
                                        # none：不走代理；system：完全按系统设置；或者写代理地址 http://127.0.0.1:7890
                                        # 遇到“HTTP 503”且没有内容，先看 docs/agents.md 的“请求失败排查”
    # headers: {X-Custom: abc}          # 额外请求头
    # extra_body:                       # 原样合并进请求体，传服务端特有参数
    #   top_k: 20
    #   chat_template_kwargs: {enable_thinking: false}   # 例如关掉 Qwen3 的思考

    # ---- 采样 ----
    temperature: 0.7
    # top_p: 0.9
    max_tokens: 512                     # 思考型模型要调大，否则 JSON 还没输出就被截断
    # stop: ["\n\n"]
    # sample_seed: 42                   # 发给服务端的采样种子

    # ---- 提示词 ----
    prompt: default                     # 提示词模板名，或 模块:类名（自己继承 PromptBuilder）
    history_lines: 40                   # 带最近多少条可见日志
    ask_reason: false                   # true：要求模型先写理由 {"reason": ..., "action": ...}，理由进数据
    show_skill_text: true               # 附上场上技能和装备的原文
    # extra_rules: "优先保留桃和闪。"     # 追加在系统提示后面的策略提示
    # system_prompt: "..."              # 整个替换系统提示

    # ---- 容错 ----
    max_retries: 2                      # 输出不合法时，把错误告诉模型再问几次
    decision_timeout: 120               # 一个决策点总共最多花几秒（含重试），超了就兜底
    fallback: rule                      # 兜底智能体；写 none 表示不兜底、直接中止这局
    skip_single: true                   # 只有一个选项时不调模型

  B:
    agent: rule

output:
  dir: runs/{name}-{time}
  # 打开输出目录里的 index.html：每局一行，点进去看录像（每个决策点下面能展开模型的提示词和回复）
  # 和 game.md（整局按时间顺序的文字轨迹）。每局的文件在 games/0001/ 这样的目录里。
  per_game: true            # 每局一个目录：replay.html、game.md、trajectory.json、llm_calls.json、result.json
  replays: all              # 前几局写录像页面：数字、all 或 none（大批量跑数据时改小，录像每局约 1 MB）
  decisions: false          # 另外把所有局的决策点合并成一个 decisions.jsonl（训练用）
  llm_calls: false          # 另外把所有局的模型调用合并成一个 llm_calls.jsonl（训练用）
  rollouts: 0               # >0 时给每个决策点附 rollout 估值（很慢）
  history: new              # 轨迹里的 history：new 只放新日志，full 放全部
  privileged: true          # 轨迹里带上帝视角字段（只能用于分析/critic，不能喂给策略）
  progress: true            # 每局结束打印一行
