# 造数据：正式跑。模拟用规则 AI（快、免费），你的强模型当裁判（每题问 5 次）。
#
#   export STEPFUN_API_KEY=你的密钥           # 强模型的密钥只放环境变量
#   python -m sgs_data configs/data/full.yaml
#
# 先用 --set key.scenarios.guojia_sell_hp=20 之类的小数跑一遍，看 stats.md 里每类题留下多少、review.md 里答案对不对，再放大。
# 想让模拟本身更强：把 rollout.policy 换成你的模型（下面注释掉的写法），但会慢很多，见 docs/data-gen.md“谁来往下打”。

name: full
workers: 8

prompt:
  name: v2
  args:
    recent_turns: 2

rollout:
  policy: rule+
  # policy:                        # 用你的模型往下打（慢）
  #   include: ../models/qwen-local.yaml
  #   temperature: 0.7
  # max_turns_ahead: 4                                               # 配合模型模拟：只往下打 4 个回合，之后按体力手牌粗估
  n_min: 32
  n_max: 128
  margin: 0.06
  z: 2.0

key:
  scenarios:
    # guojia_sell_hp: 800       # 规则 AI 模拟出来总是“出闪”，和实战经验（3 血有闪有桃一般卖血）相反，先不用；
    #                           # 换成你的模型当模拟者（rollout.policy）后再打开
    guojia_yiji_kongcheng: 500
    zhuge_kongcheng: 600
    zhuge_lightning: 500
    # simayi_fankui: 500        # 实战要看情况（有时拿手牌、有时拿连弩），规则 AI 模拟几乎总拿手牌（11 比 1），分不出情况，先不用；
    #                           # 换更强的模拟者后再打开
    zhenji_discard: 600
  test_per_scenario: 40
  test_rollout:
    n_min: 64
    n_max: 256

normal:
  games: 1500
  per_game: 6
  players:
    A: rule+
    B: rule+
    # A:                        # 用你的模型打这些局，抽到的局面更像它真会遇到的
    #   include: ../models/qwen-local.yaml
  rollout:
    n_min: 16
    n_max: 64

judge:                        # 强模型当裁判：和模拟结论不一致的题不进训练，写进 review.md
  enabled: true
  player:
    include: ../models/step-5-preview.yaml
    temperature: 0.7          # 裁判要投好几票，留一点随机性
  votes: 5
  scope: confident            # 只问模拟有结论的题（all：全问）
  on_disagree: review
  concurrency: 8

mix:
  key_share: 0.3
  max_tag_share: 0.7
  max_general_share: 0.25
  dpo_pairs_per_item: 2
