# 把对比实验跑出来的对局，导出成“三行短分析 + 编号”的训练数据（SFT）。
#
#   uv run python -m sgs_data.cot_export configs/data/cot-export.yaml
#
# 输出在 runs/cot-sft-时间/：sft.jsonl（训练用）、stats.md（留下多少、丢掉多少）。

runs:                            # 从哪些对局目录导出，可以写通配符
  - runs/compare-tips-cot-*/both
agents: []                       # 只要这些组名（label）的决策，例如 [技巧加关键分析]；空 = 全要
only_wins: false                 # true：只要赢了那一方的决策
max_chars: 80                    # 三行分析超过多少字算超长
overlong: drop                   # 超长或不是三行：drop 丢掉 / compress 让下面的模型改写成三行 / keep 照样留
compressor:                      # 只在 overlong: compress 时用
  include: ../models/step-5-preview.yaml
  temperature: 0.2
include_plain: false             # true：没写分析的普通决策也导出（答案只有编号）
drop_tips: false                 # true：把对局时注入的武将技巧从提示词里删掉
