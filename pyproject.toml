[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgs-engine"
version = "0.1.0"
description = "可扩展、可 rollout 的三国杀规则引擎（纯 Python，只依赖 PyYAML 读配置）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["sgs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
